# Canonical lazygitrs configuration, tracked in git.
#
# `make setup` symlinks ~/.config/lazygitrs/config.yml to this file, so edits
# here are version-controlled and reach every machine on clone.
#
# Never put a machine-specific absolute path in this file. A path containing a
# username is what silently broke AI commit after a machine move; use $HOME,
# which lazygitrs expands because it runs generateCommand through `sh -c`.

gui:
  showCommandLog: true
  showFileTree: true

os:
  # Explicit, so `e` opens nvim on every machine instead of whatever $EDITOR
  # happens to be. The preset supplies the templates (`nvim -- {{filename}}`,
  # `nvim +{{line}} -- {{filename}}`) and marks nvim as a terminal editor, so
  # lazygitrs suspends the TUI and waits for it.
  editPreset: nvim

git:
  autoFetch: true
  autoRefresh: true
  pagers:
    - colorArg: always
      pager: 'delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'
  commit:
    # OpenRouter rather than DeepSeek direct, whose API retains prompts; OpenRouter
    # can route to zero-data-retention endpoints only. glm-5.3-flash is the cheapest
    # model that still writes accurate messages over a 1M-token context (~$0.003 a
    # commit), and it rejects reasoning_effort=none, hence `low`. The helper reads its
    # bearer token from DEEPSEEK_API_KEY, so the OpenRouter key is aliased here instead
    # of being exported globally under a DeepSeek name.
    generateCommand: 'AI_COMMIT_API_URL=https://openrouter.ai/api/v1/chat/completions AI_COMMIT_MODEL=z-ai/glm-5.3-flash AI_COMMIT_REASONING_EFFORT=low DEEPSEEK_API_KEY="$AI_QUOTA_OPENROUTER_KEY" $HOME/.local/bin/ai-lazygitrs-commit'

customCommands:
  # W is claimed by lazygitrs' built-in diff/compare mode (src/gui/mod.rs)
  # and is handled before custom commands are dispatched, so it can never
  # fire here. K is unclaimed.
  - key: "K"
    context: "global"
    description: "Create worktree"
    command: 'lazyworktree create "{{index .PromptResponses 0}}" --from-branch "{{.CheckedOutBranch.Name}}"'
    showOutput: true
    prompts:
      - type: "input"
        title: "Worktree name"
        key: "WorktreeName"
